name: Validate workflow exports
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_exports.py
      - run: python3 -m py_compile scripts/claude_writer_bridge.py scripts/run_claude_writer_bridge.py
